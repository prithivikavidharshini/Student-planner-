<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Student Planner</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#1f2430;--muted:#6b7280;--line:#e5e7eb;--accent:#4f46e5;--ok:#22c55e;--danger:#ef4444;
--study:#dbeafe;--studyt:#1d4ed8;--health:#dcfce7;--healtht:#15803d;--food:#fef3c7;--foodt:#b45309;--break:#fce7f3;--breakt:#be185d;--skills:#ede9fe;--skillst:#6d28d9;--leisure:#cffafe;--leisuret:#0e7490;--planning:#e5e7eb;--planningt:#374151}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#1a1e33;--text:#e8eaf3;--muted:#9aa1b5;--line:#2a2f4a;--study:#1e3a8a;--studyt:#bfdbfe;--health:#14532d;--healtht:#bbf7d0;--food:#78350f;--foodt:#fde68a;--break:#831843;--breakt:#fbcfe8;--skills:#4c1d95;--skillst:#ddd6fe;--leisure:#155e75;--leisuret:#a5f3fc;--planning:#374151;--planningt:#e5e7eb}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#1a1e33;--text:#e8eaf3;--muted:#9aa1b5;--line:#2a2f4a;--study:#1e3a8a;--studyt:#bfdbfe;--health:#14532d;--healtht:#bbf7d0;--food:#78350f;--foodt:#fde68a;--break:#831843;--breakt:#fbcfe8;--skills:#4c1d95;--skillst:#ddd6fe;--leisure:#155e75;--leisuret:#a5f3fc;--planning:#374151;--planningt:#e5e7eb}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
header{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;text-align:center;padding:26px 16px}
header h1{font-size:26px}header p{opacity:.9;font-size:14px;margin-top:6px}
main{max-width:760px;margin:0 auto;padding:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.card{background:var(--card);border-radius:14px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.stat{text-align:center}.stat small{color:var(--muted);display:block;font-size:12px}.stat b{font-size:17px;color:var(--accent)}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:12px 0 4px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .4s}
.row{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
.info{flex:1;min-width:0}.t{font-size:12px;color:var(--muted)}.n{font-weight:600;overflow-wrap:anywhere}
.row.done .n{text-decoration:line-through;opacity:.55}
.row.now{background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:10px}
.tag{font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;white-space:nowrap}
.del{background:none;border:0;color:var(--danger);font-size:18px;cursor:pointer;padding:6px}
h2{font-size:17px;margin-bottom:8px}
form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
form .full{grid-column:1/-1}
input,select,button{font:inherit;padding:11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text);min-width:0}
.add{background:var(--accent);color:#fff;border:0;font-weight:700;cursor:pointer}
.reset{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;margin:14px auto 0;display:block;font-size:13px}
.empty{text-align:center;color:var(--muted);padding:20px}
</style>
</head>
<body>
<header><h1>📚 Smart Student Planner</h1><p>Plan your day • Study smart • Stay healthy</p></header>
<main>
  <div class="stats">
    <div class="card stat"><small>📅 Today</small><b id="date"></b></div>
    <div class="card stat"><small>⏰ Now</small><b id="time"></b></div>
    <div class="card stat"><small>📊 Done</small><b id="pct">0%</b></div>
  </div>
  <div class="card" style="margin-bottom:14px">
    <h2>🗓️ My Daily Schedule</h2>
    <div class="bar"><i id="fill"></i></div>
    <div id="list"></div>
  </div>
  <div class="card">
    <h2>➕ Add New Task</h2>
    <form id="form">
      <input type="time" id="start" required aria-label="Start time">
      <input type="time" id="end" required aria-label="End time">
      <input type="text" id="name" class="full" placeholder="Activity" maxlength="80" required>
      <select id="cat" class="full" aria-label="Category">
        <option value="study">Study</option><option value="health">Health</option><option value="food">Food</option>
        <option value="break">Break</option><option value="skills">Skills</option><option value="leisure">Leisure</option><option value="planning">Planning</option>
      </select>
      <button class="add full" type="submit">Add Task</button>
    </form>
  </div>
  <button class="reset" id="reset">Reset to default schedule</button>
</main>
<script>
const KEY="studentPlanner.v1";
const DEFAULTS=[
["13:30","14:00","🍛 Lunch & Rest","food"],["14:00","15:30","📚 Study / Assignments","study"],
["15:30","16:30","🏃 Exercise","health"],["16:30","17:00","☕ Refreshment","break"],
["17:00","18:30","💻 Coding / Skill Development","skills"],["18:30","19:30","🎮 Free Time","leisure"],
["19:30","20:00","🍽️ Dinner","food"],["20:00","21:30","📖 Study / Revision","study"],
["21:30","22:00","📝 Plan Tomorrow & Relax","planning"]
].map((d,i)=>({id:i+1,start:d[0],end:d[1],name:d[2],cat:d[3],done:false}));
const LABEL={study:"Study",health:"Health",food:"Food",break:"Break",skills:"Skills",leisure:"Leisure",planning:"Planning"};
const today=new Date().toDateString();
let tasks=load();
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY)||"null");
    if(s&&Array.isArray(s.tasks)){ if(s.day!==today)s.tasks.forEach(t=>t.done=false); return s.tasks; }}catch(e){}
  return DEFAULTS.map(t=>({...t}));
}
function save(){try{localStorage.setItem(KEY,JSON.stringify({day:today,tasks}))}catch(e){}}
const fmt=t=>{const[h,m]=t.split(":").map(Number);return(h%12||12)+":"+String(m).padStart(2,"0")+" "+(h<12?"AM":"PM")};
function render(){
  tasks.sort((a,b)=>a.start.localeCompare(b.start));
  const list=document.getElementById("list");list.textContent="";
  if(!tasks.length){const e=document.createElement("div");e.className="empty";e.textContent="No tasks yet. Add one below!";list.appendChild(e)}
  const nowS=new Date().toTimeString().slice(0,5);
  tasks.forEach(t=>{
    const r=document.createElement("div");r.className="row"+(t.done?" done":"")+(nowS>=t.start&&nowS<t.end?" now":"");
    const cb=document.createElement("input");cb.type="checkbox";cb.checked=t.done;cb.setAttribute("aria-label","Done");
    cb.onchange=()=>{t.done=cb.checked;save();render()};
    const info=document.createElement("div");info.className="info";
    const tm=document.createElement("div");tm.className="t";tm.textContent=fmt(t.start)+" – "+fmt(t.end);
    const nm=document.createElement("div");nm.className="n";nm.textContent=t.name;
    info.append(tm,nm);
    const tag=document.createElement("span");tag.className="tag";tag.textContent=LABEL[t.cat]||t.cat;
    tag.style.background=`var(--${t.cat})`;tag.style.color=`var(--${t.cat}t)`;
    const d=document.createElement("button");d.className="del";d.textContent="✕";d.setAttribute("aria-label","Delete");
    d.onclick=()=>{tasks=tasks.filter(x=>x!==t);save();render()};
    r.append(cb,info,tag,d);list.appendChild(r);
  });
  const done=tasks.filter(t=>t.done).length,p=tasks.length?Math.round(done/tasks.length*100):0;
  document.getElementById("pct").textContent=p+"%";document.getElementById("fill").style.width=p+"%";
}
document.getElementById("form").onsubmit=e=>{
  e.preventDefault();
  const start=document.getElementById("start").value,end=document.getElementById("end").value,name=document.getElementById("name").value.trim();
  if(!start||!end||!name)return;
  if(end<=start){alert("End time must be after start time.");return}
  tasks.push({id:Date.now(),start,end,name,cat:document.getElementById("cat").value,done:false});
  save();render();document.getElementById("name").value="";
};
document.getElementById("reset").onclick=()=>{if(confirm("Reset to the default schedule?")){tasks=DEFAULTS.map(t=>({...t}));save();render()}};
function tick(){const n=new Date();document.getElementById("date").textContent=n.toLocaleDateString(undefined,{month:"short",day:"numeric"});
  document.getElementById("time").textContent=n.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}
tick();setInterval(()=>{tick();render()},60000);render();
</script>
</body>
</html>
